<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFC46B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Toast</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://www.gstatic.com"><link rel="preconnect" href="https://firestore.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500&family=Yeseva+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4A3417;--ink-2:#8C7148;--line:#F5E4B8;
  --bg:#FFF6E0;--card:#FFFFFF;--accent:#FFC46B;--accent-deep:#D9903A;--accent-soft:#FEF0C4;--on-accent:#4A3417;
  --st-requested:#B0B7C3;--st-found:#7BB0F0;--st-packed:#F5C46B;--st-delivered:#6FB584;--st-off:#EF8A8A;
  --r:18px;--pad:16px;
}
:root[data-mode=dark]{--ink:#F4E9D2;--ink-2:#C9B58F;--line:#4A4030;--bg:#1B1712;--card:#2A241B;--accent:#E0A54E;--accent-deep:#F2C377;--accent-soft:#3A2F1E;--on-accent:#1E1A14}
:root[data-mode=dark] .field input,:root[data-mode=dark] .field select,:root[data-mode=dark] .field textarea,:root[data-mode=dark] .share,:root[data-mode=dark] .seg,:root[data-mode=dark] .chip{background:#2A241B;color:var(--ink)}
:root[data-mode=dark] nav.tabs{background:rgba(30,26,20,.92)}
:root[data-mode=dark] .sheet{background:#1B1712}
:root[data-mode=dark] .toastmsg{background:#F4E9D2;color:#1E1A14}
.field input[type=date]{min-width:0;width:100%;-webkit-appearance:none;appearance:none;display:block}
.cover{position:fixed;inset:0;z-index:60;background:#FEF7EA url(cover.jpg) center top/cover no-repeat;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:calc(48px + env(safe-area-inset-top)) 24px calc(36px + env(safe-area-inset-bottom))}
.cover h1{font-size:44px;color:#4A3417;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.cover p{color:#6B5230;margin-top:2px}
.cover .btn{width:min(320px,100%);min-height:50px;font-size:17px;box-shadow:0 6px 18px rgba(74,52,23,.25)}
.hero{text-align:center;padding:8px 0 2px}
.hero img{height:150px;width:auto;display:block;margin:0 auto -6px}
.authcard{min-height:296px;display:flex;flex-direction:column;justify-content:center}
.authcard .seg{margin-bottom:auto}
.authcard .btn.block{margin-top:auto}

.authcard .field{margin-bottom:10px}
.home-head{display:flex;gap:12px;align-items:center;margin:6px 0 12px}
.home-head img{width:56px;height:56px;border-radius:14px}
.home-head .app{font-size:24px;color:var(--accent-deep);line-height:1.1}
.bigcard{position:relative;border-radius:18px;padding:16px 14px 14px;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--accent-soft);background-size:cover;background-position:center;overflow:hidden;color:var(--ink)}
.bigcard.hasphoto::before{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(30,20,10,.75),rgba(30,20,10,.05))}
.bigcard.hasphoto{color:#fff}.bigcard.hasphoto .sub{color:#F5E4B8}
.bigcard>*{position:relative}
.bigcard .name{font-size:26px;line-height:1.2}
.bigcard .sub{font-size:14px;color:var(--ink-2);font-weight:300}
.bigcard .icons{display:flex;gap:12px;font-size:13px;margin:4px 0 8px}
.bigcard .foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px}
.bigcard .pill{background:rgba(255,255,255,.6);color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:500}
.bigcard .cam{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;color:#6B5230;border:0;z-index:2}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1*var(--pad));padding:0 var(--pad) 4px}
.hscroll .bigcard{flex:0 0 100%;scroll-snap-align:start}
.hscroll::-webkit-scrollbar{display:none}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:0 14px;min-height:38px;margin:12px 0 10px}
.search input{border:0;background:transparent;flex:1;min-height:36px;outline:none}
:root[data-mode=dark] .search{background:#2A241B}
.seg3{display:flex;background:var(--accent-soft);border-radius:12px;padding:3px;margin-bottom:12px}
.seg3 button{flex:1;padding:8px 2px;border-radius:10px;color:var(--ink-2);font-weight:400;font-size:13.5px;white-space:nowrap}
.seg3 button.on{background:var(--card);color:var(--ink);font-weight:500}
.smallcard{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.smallcard:first-child{border-top:0}
.smallcard .n{font-weight:500;font-size:16px}.smallcard .m{font-size:13px;color:var(--ink-2);font-weight:300}
.smallcard .pill{background:var(--accent-soft);color:var(--accent-deep);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0;padding-top:2px}
.prow .v{color:var(--ink-2);font-weight:300}
.prow>span:first-child{font-weight:400}
.palgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.palbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);min-height:48px}
.palbtn.on{border-color:var(--accent-deep);border-width:2px}
.palbtn .dots{display:flex}.palbtn .dots i{width:18px;height:18px;border-radius:50%;border:1.5px solid #fff;margin-right:-6px}
.prof{text-align:center;padding:8px 0 4px}
.prof .av{width:88px;height:88px;border-radius:50%;background:var(--accent-soft);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--accent-deep);overflow:hidden;position:relative;cursor:pointer}
.prof .av img{width:100%;height:100%;object-fit:cover}
.prof .nm{font-size:22px}.prof .un{color:var(--ink-2);font-size:14px}
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:14px 0}
.rows .rw{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-top:1px solid var(--line);cursor:pointer;min-height:48px}
.rows .rw:first-child{border-top:0}
.rows .rw .v{color:var(--ink-2);font-size:14px}
.ic{vertical-align:-3px;flex:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.fab{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:5}
.fab .btn{pointer-events:auto;max-width:560px;width:calc(100% - 32px);box-shadow:0 4px 14px rgba(58,36,21,.12)}
.fab .card{pointer-events:auto;max-width:560px;width:calc(100% - 32px);margin:0;box-shadow:0 4px 14px rgba(58,36,21,.12)}
.linkbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);z-index:5;display:flex;justify-content:center}
:root[data-mode=dark] .linkbar{background:rgba(30,26,20,.92)}
.linkbar .inner{display:flex;gap:8px;width:100%;max-width:560px;padding:8px 16px}
.linkbar input{flex:1;min-width:0;padding:7px 12px;border:1.5px solid var(--line);border-radius:12px;height:38px;background:var(--card)}
.linkbar .btn{height:38px;min-height:38px;padding:0 16px}
.swipe{position:relative;overflow:hidden;border-radius:var(--r);margin-bottom:10px}
.swipe .del{position:absolute;right:0;top:0;bottom:0;width:84px;z-index:0;background:#FEE2E2;color:#B91C1C;display:flex;align-items:center;justify-content:center;font-weight:500;border-radius:0 var(--r) var(--r) 0;z-index:0}
.swipe .srow{position:relative;z-index:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);transition:transform .2s;padding:12px 14px;display:flex;align-items:center;gap:12px;min-height:64px}
.swipe.open .srow{transform:translateX(-92px)}
.srow .sbody{flex:1 1 auto;min-width:0}
.srow .n{font-weight:500;font-size:16px}
.srow .m{font-size:13px;color:var(--ink-2);font-weight:300}
.srow .selc{width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:1.5px solid var(--ink-2);display:flex;align-items:center;justify-content:center;color:var(--on-accent);box-sizing:border-box}
.srow .selc.on{background:var(--accent);border-color:var(--accent)}
main.hasfab{padding-bottom:150px}
.smallcard.row{border-top:1px solid var(--line)}
.swipe:first-child .row{border-top:0}
.approx{font-size:12px;color:var(--ink-2);margin:2px 0 0;min-height:0}
.money small{font-size:11px;color:var(--ink-2);margin-left:4px}
.seg{display:flex;background:rgba(255,255,255,.6);border:1.5px solid var(--line);border-radius:999px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:7px;border-radius:999px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:#fff}
.catpick{display:flex;gap:5px;flex-wrap:nowrap}.catpick .chip{white-space:nowrap;padding:5px 8px;font-size:13px;min-height:32px;flex:1;text-align:center}
.detail-img{display:block;margin:0 auto 12px;max-width:100%;max-height:260px;object-fit:contain;border-radius:16px}
:root[data-theme=matcha]{
  --ink:#2B3A1D;--ink-2:#6A7D55;--line:#E1EBCB;
  --bg:#EFF6E2;--card:#FFFFFF;--accent:#C5E1A5;--accent-deep:#6B8E3E;--accent-soft:#EAF4D9;--on-accent:#2B3A1D;
}
*{box-sizing:border-box;margin:0;padding:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
html,body{height:100%}
html{--font-head:'Yeseva One',Prompt,serif;--font-body:Prompt,system-ui,sans-serif}
body{font-family:var(--font-body);font-weight:400;font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
h1,h2,h3,.home-head .app,.bigcard .name,.prof .nm{font-family:var(--font-head);font-weight:500;line-height:1.25}
h1{font-size:28px}h2{font-size:20px}h3{font-size:16px}
.muted{color:var(--ink-2);font-size:14px;font-weight:300}
.hidden{display:none!important}

/* layout */
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:12px;padding:14px var(--pad) 8px}
header.top .logo{width:36px;height:36px;flex:none}
header.top .title{flex:1}
header.top .title h1{font-size:22px}
header.top .title .muted{font-size:13px}
main{flex:1;padding:8px var(--pad) 90px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .inner{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;padding:10px 4px 8px;font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent-deep);font-weight:500}

/* cards & controls */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:500;min-height:44px}
.btn.deep{background:var(--accent-deep);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent-deep)}
.btn.danger{background:#FEE2E2;color:#B91C1C}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.field{margin-bottom:10px}
.field label{display:block;font-size:14px;color:var(--ink-2);margin:2px 0 0;font-weight:400;line-height:1.4}
.field input,.field select,.field textarea{width:100%;padding:7px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;min-height:38px;height:38px;line-height:22px}
.field textarea{height:auto}
.field input[type=date]{height:38px}
.field textarea{min-height:72px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1;min-width:0}.row>.btn{flex:0 0 auto;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:14px;min-height:34px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.radio{display:flex;gap:8px;align-items:flex-start;padding:10px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.radio input{margin-top:5px}
.radio b{font-weight:500;display:block}
.opts{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;min-height:48px}
.opt:first-child{border-top:0}
.opt input{position:absolute;opacity:0;width:0;height:0}
.opt .ring{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-2);flex:none;display:flex;align-items:center;justify-content:center;color:var(--on-accent)}
.opt input:checked+.ring{background:var(--accent);border-color:var(--accent)}
.opt input:checked+.ring svg{display:block}
.opt .ring svg{display:none}
.opt .lbl{flex:1;font-weight:400}
.optsub{padding:0 14px 12px 48px;border-top:0}

/* status */
.st{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.15);background:var(--st-requested);font-weight:400;white-space:nowrap}
.st.searching{background:var(--st-found)}.st.found{background:var(--st-found)}.st.packed{background:var(--st-packed)}.st.delivered{background:var(--st-delivered)}.st.cancelled,.st.notfound{background:var(--st-off)}
.steps{display:flex;gap:4px;margin:8px 0}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps span.done{background:var(--accent-deep)}
.steps.off span.done{background:var(--st-off)}

/* item */
.item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--accent-soft);flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.item .body{flex:1;min-width:0}
.item .name{font-weight:500}
.item .meta{font-size:13px;color:var(--ink-2);font-weight:300}
.item .meta a{color:var(--accent-deep)}
.acc>summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px 0}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .av{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;font-weight:500;flex:none}
.acc>summary .who{flex:1}
.acc>summary .who b{font-weight:500}
.acc>summary .caret{transition:transform .2s}
.acc[open]>summary .caret{transform:rotate(180deg)}
.badges{display:flex;gap:4px}
.badges span{min-width:22px;height:22px;padding:0 6px;border-radius:11px;font-size:12px;color:#fff;display:flex;align-items:center;justify-content:center;background:var(--st-requested)}

/* hero (landing) */
.hero h1{margin-top:0;font-size:26px}
.hero p{max-width:32ch;margin:0 auto}
.landing main{padding-bottom:80px}
.landing header.top{display:none}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(58,36,21,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px var(--pad) calc(24px + env(safe-area-inset-bottom))}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin-bottom:12px}
.field .photobox,.photobox{cursor:pointer;display:grid!important;place-items:center;width:100%;aspect-ratio:1/1;height:auto;margin:0;font-size:14px;border:2px dashed var(--line);border-radius:14px;background:var(--card);color:var(--ink-2);cursor:pointer;overflow:hidden;position:relative}
.photobox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.photobox.has img{display:block}
.photobox.has .ph{display:none}
.photobox .ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;text-align:center}

/* toast (of course) */
#toasts{position:fixed;top:12px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:99;pointer-events:none}
.toastmsg{background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;animation:pop .2s}
@keyframes pop{from{transform:translateY(-8px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.empty{text-align:center;padding:36px 12px;color:var(--ink-2)}
.empty svg{width:64px;height:64px;margin-bottom:8px}
.timeline{list-style:none;font-size:13px;color:var(--ink-2)}
.timeline li{display:flex;gap:8px;padding:2px 0}
.timeline li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent-deep);margin-top:7px;flex:none}
.share{display:flex;gap:8px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px}
.share code{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:inherit}
.ver{font-size:12px;color:var(--ink-2);text-align:center;padding:8px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="toasts"></div>
<div id="sheetRoot"></div>

 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15 15a4.5 4.5 0 0 1 6.5 4"/>',

async function renderLanding(err){

  if(!S.user){ document.body.classList.add('login'); shell(`<div class="hero"><img src="${HERO}" alt=""><h1>Toast</h1><p class="muted">หิ้วของกลับมาให้ถึงมือ</p></div>${err?`<div class="card" style="border-color:#FCA5A5">${esc(err)}</div>`:''}`+authCard()); return; }
  const ck='toast:cache:'+S.user.uid;
  if(myTripsCache===null){
    const c=LS(ck);
    if(c&&c.v===2){myTripsCache=c.trips;itemCounts=c.counts||{};S.friends=c.friends||[];S.myReq=c.myReq||[];refreshHome(true);}

let refreshing=false;
async function refreshHome(background){
  if(refreshing)return;refreshing=true;
  try{
    if(!DEMO){const ok=await fbReady;if(!ok&&!LS('toast:localUser'))return;}
    if(DEMO&&(LS('toast:demoVer')!==6)){if(LSOK)Object.keys(localStorage).filter(k=>/^toast:(trip|items|recent|friends|cache)/.test(k)).forEach(k=>localStorage.removeItem(k));await seedDemo(true);}
    else if(!DEMO&&!LS('toast:seeded:'+S.user.uid)){const mt=await store.myTrips(S.user.uid);if(!mt.length){LS('toast:seeded:'+S.user.uid,1);await seedDemo(true);}}
    const [friends,inv,trips]=await Promise.all([store.myFriends(S.user.uid),store.invitedBags(S.user.uid),store.myTrips(S.user.uid)]);
    const rec=LS('toast:recent')||[];
    const counts={};await Promise.all(trips.map(async t=>{counts[t.id]=await store.getItems(t.id);}));
    const next={v:2,at:Date.now(),trips,counts,friends,myReq:[...inv.map(t=>({id:t.id,name:t.name,shopper:t.shopper,recv:t.recv,inApp:true})),...rec.filter(r=>!inv.some(t=>t.id===r.id))]};
    const changed=JSON.stringify(next.trips)!==JSON.stringify(myTripsCache)||JSON.stringify(next.friends)!==JSON.stringify(S.friends)||JSON.stringify(next.myReq)!==JSON.stringify(S.myReq)||JSON.stringify(Object.keys(next.counts).map(k=>next.counts[k].length))!==JSON.stringify(Object.keys(itemCounts).map(k=>itemCounts[k].length));
    myTripsCache=next.trips;itemCounts=next.counts;S.friends=next.friends;S.myReq=next.myReq;
    try{LS('toast:cache:'+S.user.uid,next)}catch(e){}
    if(background&&changed&&document.body.classList.contains('landing')&&!$('.sheet-bg'))renderLanding();
  }finally{refreshing=false;}
}
function bagsView(err,linkCard){
  const today=todayStr();const q=(S.q||'').toLowerCase();
  const match=t=>!q||t.name.toLowerCase().includes(q)||(itemCounts[t.id]||[]).some(i=>(i.name+' '+i.requester+' '+(i.shop||'')).toLowerCase().includes(q));
  const all=myTripsCache.filter(match);
  const open=all.filter(t=>!t.recv||t.recv>=today);
  let now=open.filter(t=>t.close&&t.close<=today);
  if(!now.length){const dated=open.filter(t=>t.recv).sort((a,b)=>a.recv.localeCompare(b.recv));if(dated.length)now=[dated[0]];}
  const future=open.filter(t=>t.recv&&!now.includes(t)).sort((a,b)=>a.recv.localeCompare(b.recv));
  const past=all.filter(t=>t.recv&&t.recv<today).sort((a,b)=>b.recv.localeCompare(a.recv));
  const undated=open.filter(t=>!t.recv&&!now.includes(t));
  const big=t=>{const its=itemCounts[t.id]||[];const ppl=new Set(its.map(i=>i.requester)).size;const found=its.filter(i=>['found','packed','delivered'].includes(i.status)).length;const spent=its.filter(i=>['found','packed','delivered'].includes(i.status)).reduce((a,i)=>a+(Number(i.paid||i.price)||0)*(Number(i.qty)||1),0);const cover=LS('toast:cover:'+t.id);
    return `<div class="bigcard ${cover?'hasphoto':''}" style="${cover?`background-image:url(${cover})`:''}" onclick="location.href='?t=${t.id}'">
      <button type="button" class="cam" onclick="event.stopPropagation();document.getElementById('cov-${t.id}').click()" aria-label="เปลี่ยนรูปพื้นหลัง">${ic('camera',18)}</button><input id="cov-${t.id}" class="vh" type="file" accept="image/*" onclick="event.stopPropagation()" onchange="event.stopPropagation();pickCover(this,'${t.id}')">
      <div class="name">${esc(t.name)}</div>
      <div class="sub">${t.recv?'รับของ '+dfmt(t.recv):'ยังไม่ระบุวันรับของ'}${t.close?' · ปิดรับฝาก '+dfmt(t.close):''} · ${esc(t.currency||'THB')}</div>
      <div class="icons"><span>${ic('users',15)} ${ppl} คน</span><span>${ic('bag',15)} ${its.length} รายการ</span><span>${ic('check',15)} ${found} เจอแล้ว</span></div>
      <div class="foot"><span>ยอดซื้อแล้ว ${t.currency||'THB'} ${fmt(spent)}</span><span class="pill">${t.close&&t.close<=today?'กำลังหิ้ว':'เปิดรับฝาก'}</span></div></div>`};
  const small=t=>{const its=itemCounts[t.id]||[];let pill='';if(t.recv&&t.recv>=today)pill=`รับของอีก ${daysTo(t.recv)} วัน`;else if(t.recv&&t.recv<today)pill='ส่งแล้ว';else pill='ไม่ระบุวัน';
    return `<div class="smallcard" onclick="location.href='?t=${t.id}'"><div><div class="n">${esc(t.name)}</div><div class="m">${t.recv?'รับของ '+dfmt(t.recv)+' · ':''}${its.length} รายการ · ${esc(t.currency||'THB')}</div></div><span class="pill">${pill}</span></div>`};
  const lists={future,past,undated};const cur=lists[bagFilter]||[];
  return `<div class="home-head"><img src="${ICON}" alt=""><div style="flex:1"><div class="app">Toast</div><div class="muted">${greet()} ${esc(S.user.displayName||'')}<br>วันนี้หิ้วอะไรให้เพื่อนดี</div></div><button class="btn sm" style="width:44px;padding:0;font-size:24px;line-height:1" onclick="openCreate()" aria-label="สร้างกระเป๋า">+</button></div>
   ${err?`<div class="card" style="border-color:#FCA5A5">${esc(err)}</div>`:''}
   ${now.length?(now.length>1?`<div class="hscroll">${now.map(big).join('')}</div>`:big(now[0])):''}
   <div class="search">${ic('search',18)}<input id="qIn" placeholder="ค้นหากระเป๋า ปลายทาง หรือชื่อของ" value="${esc(S.q||'')}" oninput="S.q=this.value;renderLanding().then(()=>{const e=$('#qIn');e.focus();e.setSelectionRange(e.value.length,e.value.length)})"></div>
   <div class="seg3">${[['future','กำลังจะไป'],['past','ที่ผ่านมา'],['undated','ยังไม่ระบุวัน']].map(([k,l])=>`<button class="${bagFilter===k?'on':''}" onclick="bagFilter='${k}';renderLanding()">${l}</button>`).join('')}</div>
   <div class="card">${cur.length?cur.map(small).join(''):'<div class="empty">ไม่มีกระเป๋าในกลุ่มนี้</div>'}</div>
   ${now.length?'':`<button class="btn soft block" style="border-radius:14px;min-height:52px" onclick="openCreate()">${ic('plus',18)} สร้างกระเป๋า</button>`}
`;
}

   ${recent.length?recent.map(row).join('')+`<p class="muted" style="text-align:center;font-size:12px">เลื่อนซ้ายเพื่อลบออกจากรายการ</p>`:emptyState('ยังไม่ได้ฝากซื้อกับใคร','กดลิงค์ที่เพื่อนส่งมา หรือวางลิงค์ด้านล่าง')}
   <div class="linkbar"><div class="inner"><input id="tLink" placeholder="วางลิงค์ที่เพื่อนส่งมา"><button class="btn sm" onclick="openLink()">ไป</button></div></div>`;
}
function bindSwipes(){document.querySelectorAll('.swipe').forEach(el=>{let x0=null;el.ontouchstart=e=>{x0=e.touches[0].clientX};el.ontouchmove=e=>{if(x0===null)return;const dx=e.touches[0].clientX-x0;if(dx<-40){el.classList.add('open');document.querySelectorAll('.swipe.open').forEach(o=>{if(o!==el)o.classList.remove('open')})}else if(dx>20)el.classList.remove('open')};el.ontouchend=()=>{x0=null}})}
function hideReq(id){const hd=new Set(LS('toast:hiddenReq')||[]);hd.add(id);LS('toast:hiddenReq',[...hd]);LS('toast:recent',(LS('toast:recent')||[]).filter(r=>r.id!==id));toast('ลบออกจากรายการแล้ว');renderLanding()}
function toggleSel(id){if(!reqSel)return;reqSel.has(id)?reqSel.delete(id):reqSel.add(id);renderLanding()}
function hideSelected(){const hd=new Set(LS('toast:hiddenReq')||[]);reqSel.forEach(id=>hd.add(id));LS('toast:hiddenReq',[...hd]);LS('toast:recent',(LS('toast:recent')||[]).filter(r=>!reqSel.has(r.id)));const n=reqSel.size;reqSel=null;toast('ลบแล้ว '+n+' รายการ');renderLanding()}
function pickCover(inp,id){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,900/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);LS('toast:cover:'+id,c.toDataURL('image/jpeg',.7));renderLanding()};im.src=r.result};r.readAsDataURL(f)}

function itemRow(i){

  return `<div class="item" onclick="openItem('${i.id}')">
    ${i.photo?`<img class="thumb" src="${i.photo}" alt="">`:`<div class="thumb">${ic('toast',26)}</div>`}

      <div class="name">${esc(i.name)} <span class="muted">×${i.qty||1}</span></div>
      <div class="meta">${esc(i.requester)}${i.shop?' · '+esc(i.shop):''}${i.price?' · '+money(i.price):''}${i.distKm!=null?' · '+i.distKm.toFixed(1)+' กม.':''}</div>
      ${i.price&&S.trip?`<div class="meta">รวมค่าฝากซื้อ ≈ THB ${fmt(goodsThb(i)+feeFor(i))}</div>`:''}
      <div class="steps ${off?'off':''}">${FLOW.map((s,k)=>`<span class="${off?(k===0?'done':''):(k<=stepIdx?'done':'')}"></span>`).join('')}</div>
      <div style="text-align:right"><span class="st ${i.status}">${STATUS[i.status]}</span></div>
    </div></div>`;
}
let itemSort='cat';
function itemsView(){
  const f=S.filter;const offSet=['cancelled','notfound'];
  let list=S.items.filter(i=>(f.view==='off'?offSet.includes(i.status):!offSet.includes(i.status)));
  if(itemSort==='near'&&S.pos){list.forEach(i=>{i.distKm=i.lat?haversine(S.pos,i):null});list.sort((a,b)=>(a.distKm??1e9)-(b.distKm??1e9));}
  else if(itemSort==='status'){const order=['requested','searching','found','packed','delivered','cancelled','notfound'];list.sort((a,b)=>order.indexOf(a.status)-order.indexOf(b.status));}
  else{list.sort((a,b)=>(a.cat||'').localeCompare(b.cat||'','th')||(a.name||'').localeCompare(b.name||'','th'));}
  const nOff=S.items.filter(i=>offSet.includes(i.status)).length;
  let body='';
  if(itemSort==='cat'&&list.length){const g={};list.forEach(i=>(g[i.cat||'อื่น ๆ']=g[i.cat||'อื่น ๆ']||[]).push(i));body=Object.keys(g).map(k=>`<div class="card"><h3 style="margin-bottom:4px">${esc(k)} <span class="muted">${g[k].length}</span></h3>${g[k].map(itemRow).join('')}</div>`).join('');}
  else body=`<div class="card">${list.length?list.map(itemRow).join(''):'<div class="empty">ยังไม่มีของ</div>'}</div>`;
  return `
   <div class="seg"><button class="${f.view!=='off'?'on':''}" onclick="S.filter.view='all';render()">รายการทั้งหมด</button><button class="${f.view==='off'?'on':''}" onclick="S.filter.view='off';render()">ยกเลิก${nOff?' ('+nOff+')':''}</button></div>
   <div class="seg3"><button class="${itemSort==='cat'?'on':''}" onclick="itemSort='cat';render()">ตามหมวด</button><button class="${itemSort==='status'?'on':''}" onclick="itemSort='status';render()">ตามสถานะ</button><button class="${itemSort==='near'?'on':''}" onclick="itemSort='near';S.pos?render():locateMe()">${ic('pin',14)} ร้านใกล้ฉัน</button></div>
   ${list.length?body:'<div class="card"><div class="empty">ยังไม่มีของ</div></div>'}`;
}
function haversine(a,b){const R=6371,d=x=>x*Math.PI/180;const dl=d(b.lat-a.lat),dg=d(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(d(a.lat))*Math.cos(d(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function locateMe(){navigator.geolocation.getCurrentPosition(p=>{S.pos={lat:p.coords.latitude,lng:p.coords.longitude};itemSort='near';render()},()=>toast('ขอตำแหน่งไม่ได้ ลองเปิด Location ให้เบราว์เซอร์'),{enableHighAccuracy:true,timeout:8000})}

  sheet(`<h2>แชร์กระเป๋า</h2>
    <h3>ลิงค์กลุ่ม</h3><p class="muted">โยนเข้ากลุ่มได้เลย เพื่อนกดแล้วฝากได้ทันที ไม่ต้องสมัคร · ทุกคนกดลิงค์เดียวกันแต่เห็นแค่ของตัวเอง</p>
    <div class="share" style="margin:8px 0"><code>${esc(link)}</code><button class="btn sm" onclick="copyLink('${link}')">คัดลอก</button></div>
    ${navigator.share?`<button class="btn block ghost" onclick="navigator.share({title:'ฝากซื้อกับ ${esc(S.trip.shopper)} · ${esc(S.trip.name)}',url:'${link}'})">แชร์…</button>`:''}
    <h3 style="margin-top:18px">ลิงค์ส่วนตัว</h3><p class="muted">สำหรับเพื่อนที่สลับเครื่องบ่อย ใส่ชื่อแล้วส่งให้คนนั้นโดยตรง</p>
    <div class="row" style="margin-top:8px"><input id="plName" placeholder="ชื่อเพื่อน" style="padding:7px 12px;border:1.5px solid var(--line);border-radius:12px;height:38px;background:var(--card)"><button class="btn sm" onclick="personalLink()">สร้าง</button></div><div id="plOut"></div>`);
}
async function toggleInvite(fuid,on){const inv=new Set(S.trip.invited||[]);on?inv.add(fuid):inv.delete(fuid);const arr=[...inv];await store.updateTrip(S.tripId,{invited:arr});S.trip.invited=arr;toast(on?'ส่งให้แล้ว':'ยกเลิกแล้ว')}
function personalLink(){const n=$('#plName').value.trim();if(!n)return toast('ใส่ชื่อเพื่อนก่อน');const tok=uid(8);const l=location.origin+location.pathname+`?t=${S.tripId}&r=1&p=${tok}&n=${encodeURIComponent(n)}`;$('#plOut').innerHTML=`<div class="share" style="margin-top:8px"><code>${esc(l)}</code><button class="btn sm" onclick="copyLink('${l}')">คัดลอก</button></div>`}
function copyLink(l){navigator.clipboard.writeText(l).then(()=>toast('คัดลอกลิงค์แล้ว'))}

/* --- requester --- */
function renderRequester(){
  if(!S.me){shell(`<div class="card"><h2>สวัสดี</h2><p class="muted">บอกชื่อไว้หน่อย ${esc(S.trip.shopper)} จะได้รู้ว่าใครฝาก</p><div class="field" style="margin-top:10px"><input id="meName" placeholder="ชื่อเล่นของคุณ"></div><button class="btn block" onclick="S.me=$('#meName').value.trim();if(!S.me)return toast('ใส่ชื่อก่อนนะ');LS('toast:me',S.me);render()">เริ่มฝากซื้อ</button></div>`);return;}
  const mine=S.items.filter(i=>i.rid&&i.rid===S.rid);
  const t=S.trip;const closed=t.close&&t.close<todayStr();const rules=`<div class="card" style="padding:10px 14px"><div style="font-weight:500">รายละเอียดฝากซื้อ</div><div class="muted">${[t.recv?`รับของ ${dfmt(t.recv)}`:'',t.close?`ปิดรับฝาก ${dfmt(t.close)}${closed?' (ปิดแล้ว)':''}`:''].filter(Boolean).join(' · ')}${(t.recv||t.close)?'<br>':''}อัตรา 1 ${cur()} = ${(t.rate||1).toFixed(4)} THB · ${feeText(t)}${t.deposit?` · ของเกิน THB ${fmt(t.deposit)} โอนมัดจำก่อน`:''}${t.note?`<br>${esc(t.note)}`:''}</div></div>`;
  shell(rules+`
   ${closed?`<div class="card" style="text-align:center;color:var(--ink-2)">ปิดรับฝากแล้ว ติดต่อ ${esc(t.shopper)} โดยตรงถ้ามีของด่วน</div>`:`<button class="btn block" style="margin-bottom:12px" onclick="openItemForm()">+ ฝากซื้อของ</button>`}
   ${mine.length?`<div class="card">${mine.map(itemRow).join('')}</div>`:emptyState('ยังไม่มีรายการ','กดปุ่มด้านบนเพื่อฝากของชิ้นแรก')}
   <p class="muted" style="text-align:center">ฝากในชื่อ <b>${esc(S.me)}</b> · <button class="btn ghost sm" onclick="S.me='';LS('toast:me','');render()">เปลี่ยนชื่อ</button></p>`);
}
function emptyState(t,s){return `<div class="empty"><img src="${ICON}" alt="" style="width:64px;height:64px;border-radius:14px;opacity:.7"><div>${esc(t)}</div><div class="muted">${esc(s)}</div></div>`}

/* ---------- 7. sheets ---------- */
function sheet(html){$('#sheetRoot').innerHTML=`<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet" role="dialog"><div class="grip"></div>${tr(html)}</div></div>`}
function closeSheet(){$('#sheetRoot').innerHTML=''}

let photoData='',subPhotoData='';
function openItemForm(){
  photoData='';subPhotoData='';
  const asShopper=S.role==='shopper';
  sheet(`<h2>ฝากซื้อของ</h2>
   ${asShopper?`<div class="field"><label>ชื่อผู้ฝาก</label><input id="fWho" placeholder="เพื่อนคนไหน"></div>`:''}
   <div class="field"><label>รูปสินค้า</label><div class="photobox" id="fBox" onclick="document.getElementById('fFile').click()"><img id="fImg" alt=""><span class="ph">${ic('camera',28)}เพิ่มรูปสินค้า</span></div><input id="fFile" class="vh" type="file" accept="image/*" onchange="pickPhoto(this,'fImg','main')"></div>
   <div class="field"><label>ชื่อสินค้า</label><input id="fName" placeholder="เช่น Kit Kat รสชาเขียว"></div>
   <div class="row"><div class="field"><label>ราคาที่เห็น (${cur()})</label><input id="fPrice" inputmode="decimal" oninput="approx('fPrice','aPrice')"><div class="approx" id="aPrice" style="margin:2px 0 0"></div></div><div class="field"><label>จำนวน</label><input id="fQty" inputmode="numeric" value="1"></div></div>
   ${S.trip&&S.trip.fee&&S.trip.fee.type==='perKg'?`<div class="field"><label>น้ำหนักโดยประมาณ (กก.)</label><input id="fWeight" inputmode="decimal" placeholder="เช่น 1.5"></div>`:''}
   <div class="field"><label>งบไม่เกิน (${cur()}) ถ้าราคาต่างจากที่เห็น</label><input id="fBudget" inputmode="decimal" placeholder="เว้นว่างได้" oninput="approx('fBudget','aBudget')"><div class="approx" id="aBudget" style="margin:2px 0 0"></div></div>
   <div class="field"><label>ประเภท</label><div class="catpick" id="fCatPick">${CATS.map((c,i)=>`<button type="button" class="chip ${i===0?'on':''}" onclick="pickCat(this)">${c}</button>`).join('')}</div></div>
   <div class="field"><label>รายละเอียด / จุดสังเกต</label><textarea id="fDetail" placeholder="สี ขนาด รุ่น ห้ามซื้อแบบไหน"></textarea></div>
   <div class="field"><label>ร้าน</label><input id="fShop" placeholder="ชื่อร้าน / สาขา"></div>
   <div class="field"><label>ตำแหน่งร้าน</label><div class="row"><input id="fLoc" placeholder="วางลิงค์ Google Maps"><button class="btn ghost sm" onclick="useHere()">ตรงนี้</button></div></div>
   <h3 style="margin:14px 0 8px">ถ้าหาไม่เจอ ให้ทำยังไง</h3>
   <div class="opts">
   ${Object.entries(FALLBACK).map(([k,v],i)=>`<label class="opt"><input type="radio" name="fb" value="${k}" ${i===1?'checked':''} onchange="fbUI(this.value)"><span class="ring">${ic('check',14)}</span><span class="lbl">${v}</span></label>${k==='contact'?`<div class="optsub" id="contactBox"><div class="field" style="margin:0"><label>ทักฉันได้ที่ (LINE / โทร) — ไม่บังคับ</label><input id="fContact" placeholder="เช่น LINE: namwan99" value="${esc(LS('toast:contact')||'')}"></div></div>`:''}`).join('')}
   </div>
   <div id="subBox" class="hidden card">
     <h3>ของทดแทน</h3>
     <div class="field"><label>รูป</label><div class="photobox" id="sBox" onclick="document.getElementById('sFile').click()"><img id="sImg" alt=""><span class="ph">${ic('camera',24)}เพิ่มรูป</span></div><input id="sFile" class="vh" type="file" accept="image/*" onchange="pickPhoto(this,'sImg','sub')"></div>
     <div class="field"><label>ชื่อสินค้า</label><input id="sName"></div>
     <div class="row"><div class="field"><label>ราคา (${cur()})</label><input id="sPrice" inputmode="decimal" oninput="approx('sPrice','aSPrice')"><div class="approx" id="aSPrice" style="margin:2px 0 0"></div></div><div class="field"><label>จำนวน</label><input id="sQty" inputmode="numeric" value="1"></div></div>
     <div class="field"><label>รายละเอียด</label><textarea id="sDetail"></textarea></div>
     <div class="field"><label>ร้าน</label><input id="sShop"></div>
   </div>
   <button class="btn block" onclick="saveItem()">ฝากซื้อ</button>`);
}
function fbUI(v){$('#subBox').classList.toggle('hidden',v!=='substitute');$('#contactBox').classList.toggle('hidden',v!=='contact')}
function pickCat(b){[...b.parentNode.children].forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function pickPhoto(inp,imgId,which){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,720/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.6);which==='main'?photoData=d:subPhotoData=d;$('#'+imgId).src=d;$('#'+imgId).parentNode.classList.add('has');};im.src=r.result;};
  r.readAsDataURL(f);
}
function useHere(){navigator.geolocation.getCurrentPosition(p=>{$('#fLoc').value=`${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`;toast('ใส่ตำแหน่งปัจจุบันแล้ว')},()=>toast('ขอตำแหน่งไม่ได้'))}
function parseLoc(s){
  s=(s||'').trim();if(!s)return null;
  let m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/[?&](?:q|query|ll)=(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/);
  return m?{lat:+m[1],lng:+m[2],mapUrl:/^https?:/.test(s)?s:`https://maps.google.com/?q=${m[1]},${m[2]}`}:{lat:null,lng:null,mapUrl:/^https?:/.test(s)?s:''};
}
async function saveItem(){
  const who=S.role==='shopper'?$('#fWho').value.trim():S.me;
  const name=$('#fName').value.trim();
  if(!who||!name){toast('ใส่ชื่อผู้ฝากและชื่อสินค้าก่อน');return}
  if(photoData.length>900000){toast('รูปใหญ่เกินไป ลองรูปอื่น');return}
  const loc=parseLoc($('#fLoc').value)||{};
  const fb=$('input[name=fb]:checked').value;const contact=$('#fContact').value.trim();if(contact)LS('toast:contact',contact);
  const it={id:uid(8),requester:who,name,photo:photoData,price:+$('#fPrice').value||null,budget:+$('#fBudget').value||null,qty:+$('#fQty').value||1,weight:$('#fWeight')?(+$('#fWeight').value||null):null,cat:($('#fCatPick .on')||{}).textContent||CATS[0],detail:$('#fDetail').value.trim(),shop:$('#fShop').value.trim(),lat:loc.lat??null,lng:loc.lng??null,mapUrl:loc.mapUrl||'',fallback:fb,contact:contact||'',rid:S.role==='requester'?S.rid:'',requesterUid:(S.role==='requester'&&S.user)?S.user.uid:'',status:'requested',log:[{s:'requested',at:Date.now()}]};
  if(fb==='substitute')it.substitute={name:$('#sName').value.trim(),photo:subPhotoData,price:+$('#sPrice').value||null,qty:+$('#sQty').value||1,detail:$('#sDetail').value.trim(),shop:$('#sShop').value.trim()};
  await store.addItem(S.tripId,it);closeSheet();toast('ฝากแล้ว');
}

function openItem(id){
  const i=S.items.find(x=>x.id===id);if(!i)return;
  const isShopper=S.role==='shopper';const off=['cancelled','notfound'].includes(i.status);
  const next=FLOW[FLOW.indexOf(i.status)+1];
  const sub=i.substitute&&i.substitute.name?`<div class="card"><h3>ของทดแทนถ้าหาไม่เจอ</h3><div class="item">${i.substitute.photo?`<img class="thumb" src="${i.substitute.photo}">`:`<div class="thumb">${ic('swap',26)}</div>`}<div class="body"><div class="name">${esc(i.substitute.name)} <span class="muted">×${i.substitute.qty}</span></div><div class="meta">${i.substitute.price?money(i.substitute.price)+' · ':''}${esc(i.substitute.shop||'')}</div><div class="muted">${esc(i.substitute.detail||'')}</div></div></div></div>`:'';
  sheet(`
   ${i.photo?`<img class="detail-img" src="${i.photo}" alt="">`:''}
   <h2>${esc(i.name)} <span class="muted">×${i.qty}</span></h2>
   <p class="muted">ฝากโดย ${esc(i.requester)} · ${esc(i.cat)}</p>
   <div style="margin:8px 0"><span class="st ${i.status}">${STATUS[i.status]}</span></div>
   <div class="card">
     ${i.price?`<div>ราคาที่เห็น ${money(i.price)}${i.budget?`<br>งบไม่เกิน ${money(i.budget)}`:''}</div>`:''}
     ${i.detail?`<div style="margin-top:4px">${esc(i.detail)}</div>`:''}
     ${i.shop||i.mapUrl?`<div class="meta" style="margin-top:6px">${ic('pin',14)} ${esc(i.shop||'ร้าน')} ${i.mapUrl?`<a href="${esc(i.mapUrl)}" target="_blank" rel="noopener">เปิดแผนที่</a>`:''}</div>`:''}
     <div class="muted" style="margin-top:6px">ถ้าหาไม่เจอ: ${FALLBACK[i.fallback]}${i.fallback==='contact'&&i.contact?` — <b>${esc(i.contact)}</b>`:''}</div>
   </div>
   ${sub}
   ${i.paid?`<p class="muted">ซื้อจริง ${money(i.paid)}</p>`:''}
   ${i.note?`<p class="muted">หมายเหตุจากผู้รับฝาก: ${esc(i.note)}</p>`:''}
   <ul class="timeline">${(i.log||[]).map(l=>`<li>${STATUS[l.s]} · ${new Date(l.at).toLocaleString(LANG==='en'?'en-US':'th-TH',LANG==='en'?{month:'short',day:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}:{dateStyle:'short',timeStyle:'short'})}</li>`).join('')}</ul>
   ${isShopper&&!off&&next?`<div style="margin-top:14px">${['requested','searching'].includes(i.status)?`<div class="field"><label>ราคาที่ซื้อจริง (${cur()}) — ใส่หรือไม่ก็ได้</label><input id="uPaid" inputmode="decimal" value="${i.paid||''}" oninput="approx('uPaid','aPaid')"><div class="approx" id="aPaid" style="margin:2px 0 0"></div></div>`:''}<button class="btn block" onclick="setStatus('${i.id}','${next}')">→ ${STATUS[next]}</button></div>`:''}
   ${isShopper&&!off?`<div class="row" style="margin-top:8px"><button class="btn danger" onclick="setStatus('${i.id}','notfound')">หาไม่ได้</button><button class="btn ghost" onclick="setStatus('${i.id}','cancelled')">ยกเลิก</button></div>`:''}
   ${isShopper&&off?`<button class="btn ghost block" style="margin-top:8px" onclick="setStatus('${i.id}','requested')">เปิดรายการใหม่</button>`:''}
   ${!isShopper&&i.status==='requested'?`<button class="btn danger block" style="margin-top:14px" onclick="setStatus('${i.id}','cancelled')">ยกเลิกรายการนี้</button>`:''}
   ${!isShopper&&i.status!=='requested'?`<p class="muted" style="margin-top:12px">${esc(S.trip.shopper)} รับเรื่องแล้ว ถ้าจะแก้ไข ทักไปบอกโดยตรงนะ</p>`:''}`);
}
async function setStatus(id,s){
  const i=S.items.find(x=>x.id===id);
  const patch={status:s,log:[...(i.log||[]),{s,at:Date.now()}]};
  const p=$('#uPaid');if(p&&p.value)patch.paid=+p.value;
  await store.updateItem(S.tripId,id,patch);closeSheet();
  toast(s==='delivered'?'ถึงมือแล้ว!':'อัปเดตเป็น "'+STATUS[s]+'"');
}

/* ---------- 8. settings ---------- */
function openSettings(){
  const th=document.documentElement.dataset.theme;const shopper=!S.trip||S.role==='shopper';
  sheet(`<h2>ตั้งค่า</h2>
   ${shopper?`<div class="field"><label>ธีมสี</label><div class="chips"><button class="chip ${th==='tangerine'?'on':''}" onclick="setTheme('tangerine');openSettings()">Tangerine</button><button class="chip ${th==='matcha'?'on':''}" onclick="setTheme('matcha');openSettings()">Matcha</button></div></div>`:''}
   ${S.trip&&S.role==='requester'?`<p class="muted">คุณกำลังดูในฐานะผู้ฝาก${S.user?'':' · ถ้าคุณคือผู้รับฝาก ให้เข้าสู่ระบบที่หน้าแรก'}</p>`:''}
   ${S.trip&&S.role==='shopper'?`<div class="field"><label>สกุลเงิน ${cur()}${cur()!=='THB'?` · อัตรา 1 ${cur()} = THB`:''}</label>${cur()!=='THB'?`<div class="row"><input id="rateIn" inputmode="decimal" value="${S.trip.rate||''}"><button class="btn sm" style="flex:0" onclick="saveRate()">บันทึก</button></div>`:''}</div><a class="btn ghost block" href="?t=${S.tripId}&r=1">ดูหน้าแบบผู้ฝาก</a>`:''}
   <a class="btn ghost block" style="margin-top:8px" href="./">หน้าแรก</a>
   <div class="ver">Toast v${VERSION} · ${store.online?'เชื่อมต่อ Firebase':'โหมดทดลองในเครื่อง'}</div>`);
}
async function saveRate(){const r=+$('#rateIn').value;if(!r)return toast('ใส่อัตราเป็นตัวเลข');await store.updateTrip(S.tripId,{rate:r});S.trip.rate=r;closeSheet();render();toast('บันทึกอัตราแล้ว')}
function setTheme(t){document.documentElement.dataset.theme=t;LS('toast:theme',t);applyMode()}

/* ---------- 9. PWA ---------- */
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)w.postMessage('SKIP_WAITING')})})});let refreshed=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshed){refreshed=true;location.reload()}})}
boot();
</script>
</body>
</html>
